<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Gata Favorita</title>
<style>
#error,#ok,#foto{display:none;font-weight:bold;margin-top:15px}
#error{color:red} #ok{color:green}
#joaqui:checked~#ok{display:block}
#toti:checked~#error,#piki:checked~#error,#mari:checked~#error{display:block}
#toti:checked~#foto,#piki:checked~#foto,#mari:checked~#foto{display:block}
#corazones{
display:none;
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
pointer-events: none;
overflow: hidden;
}
#joaqui : checked ~ #corazones{display:block}
#corazones span{
position: absolute;}
top: -20px;
font-size: 24px;
animation: caer 3s linear infinite;
}   
#corazones span:nth-child(1){left: 10%; animation-delay: 0s;}
#corazones span:nth-child(2){left: 20%; animation-delay: 0.3s; font-size: 30px;}
#corazones span:nth-child(3){left: 30%; animation-delay: 0.6s;}
#corazones span:nth-child(4){left: 40%; animation-delay: 0.1s; font-size: 18px;}
#corazones span:nth-child(5){left: 50%; animation-delay: 0.8s; font-size: 28px;}
#corazones span:nth-child(6){left: 60%; animation-delay: 0.2s;}
#corazones span:nth-child(7){left: 70%; animation-delay: 0.5s; font-size: 32px;}
#corazones span:nth-child(8){left: 80%; animation-delay: 0.4s;}
#corazones span:nth-child(9){left: 90%; animation-delay: 0.7s; }
#corazones span:nth-child(10){left: 100%; animation-delay: 1s;}
@keyframes caer {
0% {transform: translateY(0) rotate(0deg); opacity: 1;}
100% {transform: translateY(100vh) rotate(360deg); opacity: 0;}
}
</style>
</head>
<body>
<h2>¿Quien es tu gata favorita? 🐱</h2>
<form>
<input type="radio" name="g" id="joaqui"><label for="joaqui"> Joaqui</label><br>
<input type="radio" name="g" id="toti"><label for="toti"> Toti</label><br>
<input type="radio" name="g" id="piki"><label for="piki"> Piki</label><br>
<input type="radio" name="g" id="mari"><label for="mari"> Mari</label><br>
<div id="corazones">
<span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span>
<span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span><span>💖</span>
</div>
<p id="error">ERROR: ESA NO ES TU GATA FAVORITA</p>
<p id="ok">GRACIAS POR VOTAR POR JOAQUI</p>
<img id="foto" src="Joaqui.jpeg" width="300">
</form>
</body>
</html>
